# Publica la tienda en GitHub Pages cada vez que hay cambios en "main".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:
  # Botón "Actualizar sitio" en la hoja de pedidos
  repository_dispatch:
    types: [sheet-updated]
  # Todos los días a las 6:00 hora de Nicaragua (12:00 UTC), para tomar precios nuevos de la hoja
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # URL del Apps Script de la hoja de pedidos (Settings → Secrets and variables → Actions → Variables)
          SHEET_API_URL: ${{ vars.SHEET_API_URL }}
          # Inicio de sesión de clientes (Firebase). Sin estas variables no se muestra "Mi cuenta".
          PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
